<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pendaftaran Event Firebase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ==============================
             FORM PENDAFTARAN
             ============================== -->

        <div class="card">

            <h1>Pendaftaran Event</h1>

            <p>
                Silakan isi data untuk mengikuti event.
            </p>

            <form id="registrationForm">

                <div class="form-group">

                    <label for="name">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Masukkan nama lengkap"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="contoh@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Nomor HP
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="08xxxxxxxxxx"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="event">
                        Pilih Event
                    </label>

                    <select id="event" required>

                        <option value="">
                            -- Pilih Event --
                        </option>

                        <option value="Workshop Firebase">
                            Workshop Firebase
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="UI/UX Design">
                            UI/UX Design
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Daftar Sekarang
                </button>

            </form>

        </div>



        <!-- ==============================
             DAFTAR PESERTA
             ============================== -->

        <div class="participant-section">

            <h2>Daftar Peserta</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>

                            <th>Nama</th>

                            <th>Email</th>

                            <th>No. HP</th>

                            <th>Event</th>

                            <th>Aksi</th>

                        </tr>

                    </thead>


                    <tbody id="participantList">

                        <!-- Data Firestore akan muncul di sini -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- Firebase + JavaScript -->

    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
